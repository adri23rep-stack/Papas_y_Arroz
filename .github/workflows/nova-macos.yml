name: Nova macOS Intel (experimental)

on:
  push:
    branches: [feature/nova-macos-tahoe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nova-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Get Nova source
        uses: actions/checkout@v4

      - name: Install macOS build libraries
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install cmake ninja pkgconf qtbase qtdeclarative sdl2 sdl3 sdl2_ttf mpv curl webp mbedtls@3 qrencode libpng jpeg-turbo
          packages=(qtbase qtdeclarative sdl2 sdl3 sdl2_ttf mpv curl webp mbedtls@3 qrencode libpng jpeg-turbo)
          cmake_prefixes=()
          pkg_paths=()
          for package in "${packages[@]}"; do
            prefix="$(brew --prefix "$package")"
            cmake_prefixes+=("$prefix")
            pkg_paths+=("$prefix/lib/pkgconfig" "$prefix/share/pkgconfig")
          done
          IFS=';'
          echo "CMAKE_PREFIX_PATH=${cmake_prefixes[*]}" >> "$GITHUB_ENV"
          IFS=':'
          echo "PKG_CONFIG_PATH=${pkg_paths[*]}" >> "$GITHUB_ENV"

      - name: Configure Nova Qt x86_64
        run: |
          cmake -S . -B build/nova-macos -G Ninja \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DMBEDCRYPTO_LIBRARY="$(brew --prefix mbedtls@3)/lib/libmbedcrypto.dylib" \
            -DMBEDTLS_INCLUDE_DIR="$(brew --prefix mbedtls@3)/include"

      - name: Build Nova Qt for macOS
        run: cmake --build build/nova-macos --target XuperTVNovaQt --parallel 3

      - name: Bundle local Nova data
        run: |
          APP="build/nova-macos/XuperTVNovaQt.app"
          BIN="$APP/Contents/MacOS"
          test -x "$BIN/XuperTVNovaQt"
          for name in cacert.pem service.template.json test.mp4; do
            cp "packaging/runtime/switch/xuperswitch/$name" "$BIN/$name"
          done
          cp catalog.m3u "$BIN/"
          mkdir -p "$BIN/shaders"
          cp shaders/FSRCNNX_x2_8-0-4-1.glsl "$BIN/shaders/"
          sed -i '' 's#sdmc:/switch/xuperswitch/cacert.pem#cacert.pem#g' "$BIN/service.template.json"

      - name: Smoke test Nova interface
        run: |
          APP="build/nova-macos/XuperTVNovaQt.app"
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            "$APP/Contents/MacOS/XuperTVNovaQt" --smoke
          cat "$APP/Contents/MacOS/nova-qt-smoke.log"
          grep -q timer_fired "$APP/Contents/MacOS/nova-qt-smoke.log" || exit 1
          grep -q event_loop_end "$APP/Contents/MacOS/nova-qt-smoke.log" || exit 1

      - name: Deploy Qt libraries and make Mac package
        run: |
          APP="build/nova-macos/XuperTVNovaQt.app"
          MACDEPLOY="$(brew --prefix qtbase)/bin/macdeployqt"
          if [[ -x "$MACDEPLOY" ]]; then
            perl -e 'alarm 240; exec @ARGV' "$MACDEPLOY" "$APP" -qmldir=ui/novaqt -verbose=1 || echo "WARNING: macdeployqt timed out; check packaged Qt modules."
          else
            echo "WARNING: macdeployqt unavailable; macOS app requires Homebrew Qt libraries."
          fi
          # Homebrew SDL2 now resolves to sdl2-compat (SDL 2 API backed by SDL3).
          # SDL3 is opened with dlopen, so macdeployqt/otool do not see it.
          FRAMEWORKS="$APP/Contents/Frameworks"
          SDL3_SOURCE="$(brew --prefix sdl3)/lib/libSDL3.0.dylib"
          test -f "$FRAMEWORKS/libSDL2-2.0.0.dylib"
          test -f "$SDL3_SOURCE"
          cp -L "$SDL3_SOURCE" "$FRAMEWORKS/libSDL3.0.dylib"
          ln -sfn libSDL3.0.dylib "$FRAMEWORKS/libSDL3.dylib"
          install_name_tool -id "@loader_path/libSDL3.0.dylib" "$FRAMEWORKS/libSDL3.0.dylib"
          test -f "$FRAMEWORKS/libSDL3.dylib"

          # Exercise SDL2 -> SDL3 from a binary INSIDE the actual app bundle.
          # SDL_Init(0) forces the wrapper to load SDL3; -smoke alone skips it.
          cat > /tmp/nova_sdl_probe.c <<'NOVASDL'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(void) {
            void *sdl = dlopen("@executable_path/../Frameworks/libSDL2-2.0.0.dylib", RTLD_NOW);
            if (!sdl) { fprintf(stderr, "SDL2 load: %s\\n", dlerror()); return 1; }
            int (*SDL_Init)(unsigned int) = (int (*)(unsigned int)) dlsym(sdl, "SDL_Init");
            if (!SDL_Init) { fprintf(stderr, "SDL_Init missing\\n"); return 2; }
            if (SDL_Init(0) != 0) { fprintf(stderr, "SDL_Init failed\\n"); return 3; }
            puts("NOVA_SDL2_SDL3_BUNDLE_OK");
            dlclose(sdl);
            return 0;
          }
          NOVASDL
          clang /tmp/nova_sdl_probe.c -o "$APP/Contents/MacOS/NovaSDLProbe"
          "$APP/Contents/MacOS/NovaSDLProbe"
          rm "$APP/Contents/MacOS/NovaSDLProbe"
          # Ad-hoc sign after modifying the binaries; Gatekeeper is still
          # expected to request user approval because this is not notarized.
          codesign --force --deep --sign - "$APP"
          otool -L "$FRAMEWORKS/libSDL3.0.dylib"
          mkdir -p dist/Nova-macOS-Tahoe-Intel
          cp -R "$APP" dist/Nova-macOS-Tahoe-Intel/Nova.app
          cp README_MACOS.md dist/Nova-macOS-Tahoe-Intel/
          otool -L "$APP/Contents/MacOS/XuperTVNovaQt"
          (cd dist && ditto -c -k --sequesterRsrc --keepParent Nova-macOS-Tahoe-Intel Nova-macOS-Tahoe-Intel.zip)

      - name: Upload Nova macOS .app
        uses: actions/upload-artifact@v4
        with:
          name: Nova-macOS-Tahoe-Intel
          path: dist/Nova-macOS-Tahoe-Intel.zip
          retention-days: 14
