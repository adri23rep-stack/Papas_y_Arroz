name: Windows desktop preview (no release)

on:
  push:
    branches: [windows-desktop-preview]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Windows port
        uses: actions/checkout@v4

      - name: Fetch pinned upstream source and apply Windows changes
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/jonaruacho/Xuper-TV-by-JonaRuacho.git upstream
          git -C upstream checkout --detach 438c378706c1355d2f306d2d62508bdc53559cd3
          python -c 'import base64,zlib,pathlib; pathlib.Path("upstream/windows.patch").write_bytes(zlib.decompress(base64.b64decode(pathlib.Path("patches/windows-port-core.zlib.b64").read_text())))'
          git -C upstream apply --check windows.patch
          git -C upstream apply windows.patch
          cp README_WINDOWS.md upstream/README_WINDOWS.md

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-mbedtls
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-ntldd

      - name: Compile and run unit tests
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd upstream
          cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/windows --parallel 2
          ctest --test-dir build/windows --output-on-failure

      - name: Bundle portable EXE, DLLs, sample media, credits
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd upstream
          mkdir -p dist/Xuper-TV-Desktop/licenses
          cp build/windows/XuperTVDesktop.exe dist/Xuper-TV-Desktop/
          cp packaging/runtime/switch/xuperswitch/font.ttf dist/Xuper-TV-Desktop/
          cp packaging/runtime/switch/xuperswitch/cacert.pem dist/Xuper-TV-Desktop/
          cp packaging/runtime/switch/xuperswitch/test.mp4 dist/Xuper-TV-Desktop/
          cp catalog.m3u dist/Xuper-TV-Desktop/
          cp LICENSE LICENSE.nlohmann-json COPYRIGHT.mpv DEPENDENCIAS.md README_WINDOWS.md dist/Xuper-TV-Desktop/
          cp -r licenses/. dist/Xuper-TV-Desktop/licenses/
          ntldd -R build/windows/XuperTVDesktop.exe > build/windows/dependencies.txt
          while IFS= read -r dll; do
            [[ -z "$dll" ]] && continue
            path=$(find /ucrt64/bin -maxdepth 1 -iname "$dll" -print -quit)
            [[ -n "$path" ]] && cp -n "$path" dist/Xuper-TV-Desktop/ || true
          done < <(sed -nE 's/^[[:space:]]*([^[:space:]]+\.dll)[[:space:]]+=>.*/\1/ip' build/windows/dependencies.txt | sort -fu)
          if grep -qi 'not found' build/windows/dependencies.txt; then
            cat build/windows/dependencies.txt
            exit 1
          fi
          ls -lh dist/Xuper-TV-Desktop/XuperTVDesktop.exe

      - name: Upload Windows build (no release)
        uses: actions/upload-artifact@v4
        with:
          name: Xuper-TV-Desktop-Windows-preview
          path: upstream/dist/Xuper-TV-Desktop/
          if-no-files-found: error
