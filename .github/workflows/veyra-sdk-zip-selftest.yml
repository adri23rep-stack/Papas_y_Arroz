name: Nova Veyra Optical Flow ZIP preflight

on:
  push:
    branches: [feature/nova-veyra-engine]
    paths:
      - 'tools/Prepare-NovaVeyraOpticalFlow.ps1'
      - 'tools/Complete-NovaVeyraNative.ps1'
      - 'tools/Build-NovaVeyraNative.ps1'
      - 'tools/Build-NovaVeyraEngine.ps1'
      - 'tools/Stage-NovaVeyraNative.ps1'
      - 'tools/Test-NovaVeyraNative.ps1'
      - '.github/workflows/veyra-sdk-zip-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validate-user-sdk-layout:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Parse PowerShell and extract synthetic sample
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($name in @(
            'Prepare-NovaVeyraOpticalFlow.ps1',
            'Complete-NovaVeyraNative.ps1',
            'Build-NovaVeyraNative.ps1',
            'Build-NovaVeyraEngine.ps1',
            'Stage-NovaVeyraNative.ps1',
            'Test-NovaVeyraNative.ps1'
          )) {
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path 'tools' $name),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){ throw ("Script parse failed: "+$name+" "+($errors | Out-String)) }
          }
          $fixture=Join-Path $env:RUNNER_TEMP 'veyra-test-zip'
          $froot=Join-Path $fixture 'input/Optical_Flow_SDK_5.0.7'
          foreach ($rel in @(
            'NvOFInterface/nvOpticalFlowCommon.h',
            'NvOFInterface/nvOpticalFlowD3D12.h',
            'Common/NvOFBase/NvOF.h',
            'Common/NvOFBase/NvOFD3D12.h',
            'LicenseAgreement.pdf'
          )) {
            $file=Join-Path $froot $rel
            New-Item -ItemType Directory -Path (Split-Path -Parent $file) -Force | Out-Null
            'Synthetic fixture: no NVIDIA content' | Set-Content -LiteralPath $file
          }
          $zip=Join-Path $fixture 'synthetic.zip'
          Compress-Archive -Path $froot -DestinationPath $zip
          $out=Join-Path $fixture 'stage'
          & ./tools/Prepare-NovaVeyraOpticalFlow.ps1 -ZipPath $zip -Destination $out -CheckOnly
          if(Test-Path $out){throw 'CheckOnly wrote unexpected data'}
          & ./tools/Prepare-NovaVeyraOpticalFlow.ps1 -ZipPath $zip -Destination $out
          foreach ($rel in @('Common/NvOFBase/NvOF.h','NvOFInterface/nvOpticalFlowD3D12.h')){
            if(-not(Test-Path (Join-Path $out $rel))){throw "Unpacked SDK layout incomplete: $rel"}
          }
          # Local CheckOnly must verify the real Visual Studio native tools as
          # well as the SDK layout, before cloning/building anything.
          & ./tools/Complete-NovaVeyraNative.ps1 -OpticalFlowZip $zip -Workspace (Join-Path $fixture 'check-only') -CheckOnly
          if($LASTEXITCODE -and $LASTEXITCODE -ne 0){ throw 'Native compiler preflight failed' }
          if(Test-Path (Join-Path $fixture 'check-only')){ throw 'CheckOnly unexpectedly wrote to disk' }
          # Catch regressions like --x-install-root=(Join-Path ...), which
          # is passed to the native process incorrectly and produces
          # almost_canonical("") without installing FFmpeg.
          $complete=Get-Content -LiteralPath 'tools/Complete-NovaVeyraNative.ps1' -Raw
          if($complete -match '--x-install-root=\('){
            throw 'vcpkg install root must be fully evaluated before native process invocation'
          }
          if($complete -notmatch '\$vcpkgArgs=@\(' -or $complete -notmatch '--x-install-root=\$installRoot'){
            throw 'vcpkg invocation does not use one evaluated install root argument'
          }
          $rootWithSpaces=Join-Path $env:RUNNER_TEMP 'Veyra dependency prefix with spaces'
          $installRoot=Join-Path $rootWithSpaces 'installed'
          $vcpkgArgs=@('install','ffmpeg[avcodec,avformat,swresample,swscale]:x64-windows',"--x-install-root=$installRoot")
          if($vcpkgArgs.Count -ne 3 -or $vcpkgArgs[2] -ne "--x-install-root=$installRoot" -or
             $vcpkgArgs[2] -match '[()]'){
            throw 'Incorrect PowerShell argument expansion for a Windows dependency path'
          }
          $buildScript=Get-Content -LiteralPath 'tools/Build-NovaVeyraNative.ps1' -Raw
          if($buildScript -notmatch 'VEYRA_CUDA_DRIVER_INCLUDE_DIR=' -or
             $buildScript -notmatch 'RequireVfg' -or
             $buildScript -notmatch "Join-Path \\$cuda 'cuda.h'"){
             throw 'Native NVIDIA-VFG must configure CUDA Driver headers and refuse missing cuda.h'
          }
          if($complete -notmatch 'FindCudaDriverHeaders' -or $complete -notmatch 'CudaIncludeDirectory'){
             throw 'Complete build must auto-detect CUDA Driver headers before compiling VFG'
          }
          Write-Host 'PASS: Windows MSVC, SDK preflight and FFmpeg vcpkg native argument building'

      - name: Validate native GPU staging without vendor binaries
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'synthetic-native-staging'
          $build=Join-Path $root 'build'
          $nova=Join-Path $root 'nova'
          $source=Join-Path $root 'source'
          $portable=Join-Path $root 'veyra-portable'
          $out=Join-Path $root 'output'
          $shaders=Join-Path $build 'shaders'
          foreach($folder in @($build,$nova,$source,$portable,$shaders)){
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
          }
          $cpp=Join-Path $root 'synthetic.cpp'
          @'
          #include <windows.h>
          // Synthetic export table only, not GPU code or a valid Veyra runtime.
          #define STUB(fn) extern "C" __declspec(dllexport) unsigned int __cdecl fn(void) { return GetCurrentProcessId() != 0 ? 3u : 0u; }
          STUB(nova_veyra_abi)
          STUB(nova_veyra_create)
          STUB(nova_veyra_destroy)
          STUB(nova_veyra_open)
          STUB(nova_veyra_stop)
          STUB(nova_veyra_pause)
          STUB(nova_veyra_seek)
          STUB(nova_veyra_volume)
          STUB(nova_veyra_rate)
          STUB(nova_veyra_settings)
          STUB(nova_veyra_snapshot)
          STUB(nova_veyra_audio_count)
          STUB(nova_veyra_audio_at)
          STUB(nova_veyra_select_audio)
          '@ | Set-Content -LiteralPath $cpp
          $dll=Join-Path $build 'nova_veyra_native.dll'
          & cl.exe /nologo /LD /MT "/Fe:$dll" $cpp
          if($LASTEXITCODE -ne 0){throw 'Synthetic DLL compile failed'}
          'Synthetic GPU tester EXE (not executable)' | Set-Content -LiteralPath (Join-Path $build 'nova_veyra_native_smoke.exe')
          'Synthetic Nova EXE (not executable)' | Set-Content -LiteralPath (Join-Path $nova 'XuperTVNovaQt.exe')
          'Synthetic Veyra EXE (not executable)' | Set-Content -LiteralPath (Join-Path $portable 'veyra_qml_ui.exe')
          'Synthetic source license test data' | Set-Content -LiteralPath (Join-Path $source 'LICENSE')
          'Synthetic third-party notice test data' | Set-Content -LiteralPath (Join-Path $source 'THIRD_PARTY_NOTICES.md')
          for($i=0;$i -lt 15;$i++){
            'Synthetic DXIL (not executable)' | Set-Content -LiteralPath (Join-Path $shaders ('Dummy'+$i+'.dxil'))
          }
          'Synthetic DXIL (not executable)' | Set-Content -LiteralPath (Join-Path $shaders 'ScaleBlit.dxil')
          $parameters=@{
            NovaDirectory=$nova; NativeBuildDirectory=$build; VeyraSource=$source;
            PortableVeyraDirectory=$portable; FfmpegRoot=(Join-Path $root 'ffmpeg');
            Output=$out
          }
          & ./tools/Stage-NovaVeyraNative.ps1 @parameters -CheckOnly
          if(Test-Path -LiteralPath $out){throw 'Native stage CheckOnly unexpectedly wrote files'}
          & ./tools/Stage-NovaVeyraNative.ps1 @parameters
          foreach($name in @('nova_veyra_native.dll','nova_veyra_native_smoke.exe','XuperTVNovaQt.exe','Start-NovaVeyraNative.ps1','Test-NovaVeyraNative.ps1','LICENSE','LICENSE.MIT-UPSTREAM','shaders/ScaleBlit.dxil')){
            if(-not(Test-Path -LiteralPath (Join-Path $out $name) -PathType Leaf)){
              throw ('Native stage output missing: '+$name)
            }
          }
          $starter=Get-Content -LiteralPath (Join-Path $out 'Start-NovaVeyraNative.ps1') -Raw
          if($starter -notmatch 'NOVA_VEYRA_NATIVE_STRICT'){
            throw 'Native startup must not silently fall back to MPV during hardware test'
          }
          Write-Host 'PASS: synthetic stage manifest, GPL attribution and strict GPU test launcher.'
