name: Xuper TV Desktop | Windows preview

on:
  push:
    branches: [windows-desktop-preview, feature/ui-cinematic-tv, feature/apple-controller-server, feature/cinematic-ui-v2, feature/search-remote-catalog, feature/youtube-browser-remote, fix/youtube-hidpi-video, feature/classic-remote-command-support, feature/video-enhanced-stage1, feature/video-enhanced-contrast-stage2, feature/video-enhanced-gpu-stage3, feature/xuper-native-engine-v1, feature/xuper-native-player-v2, feature/iphone-catalog-settings, feature/qr-pairing-remembered, feature/provider-catalog-tiles, fix/live-tv-recovery, feature/private-iphone-player, feature/nova-ui-from-scratch]
    paths:
      - '.github/workflows/bootstrap-windows.yml'
      - 'patches/**'
      - 'source/**'
      - 'include/**'
      - 'tests/**'
      - 'tools/**'
      - 'ui/novaqt/**'
      - 'README_WINDOWS.md'
      - 'README_NOVA_UI.md'
      - 'README_VIDEO_ENHANCED.md'
      - 'CMakeLists.txt'
      - 'shaders/**'
      - 'README_NATIVE_ENGINE.md'
      - 'README_NATIVE_PLAYER.md'
      - 'README_IPHONE_CATALOG.md'
      - 'README_QR_PAIRING.md'
      - 'README_PROVIDER_CATALOG.md'
      - 'README_LIVE_TV.md'
      - 'catalog.m3u'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-windows.yml'
      - 'source/**'
      - 'include/**'
      - 'tests/**'
      - 'ui/novaqt/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: xuper-native-player-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import-source:
    name: Import original sources and apply Windows changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Import pinned MIT-licensed upstream and apply preview patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/main.cpp ]]; then
            echo "Windows source already exists; leaving it unchanged."
            exit 0
          fi
          git init -q "$RUNNER_TEMP/xuper-upstream"
          git -C "$RUNNER_TEMP/xuper-upstream" remote add origin https://github.com/jonaruacho/Xuper-TV-by-JonaRuacho.git
          git -C "$RUNNER_TEMP/xuper-upstream" fetch --depth=1 origin 438c378706c1355d2f306d2d62508bdc53559cd3
          git -C "$RUNNER_TEMP/xuper-upstream" checkout --detach FETCH_HEAD
          rsync -a --exclude='.git' --exclude='.github/workflows/' "$RUNNER_TEMP/xuper-upstream/" "$GITHUB_WORKSPACE/"
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import zlib
          src = Path('patches/windows-port-core.zlib.b64').read_text().strip()
          Path('/tmp/windows-port.patch').write_bytes(zlib.decompress(base64.b64decode(src)))
          PY
          git apply --check /tmp/windows-port.patch
          git apply /tmp/windows-port.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import JonaRuacho source and apply Windows desktop preview"
          git push origin HEAD:$GITHUB_REF_NAME
  windows-build:
    name: Build portable Windows executable
    needs: import-source
    runs-on: windows-latest
    permissions:
      contents: write  # Needed only for isolated, temporary build-delivery branch.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: MSYS2 UCRT64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-mbedtls
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-qrencode
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-imageformats
      - name: Configure, compile and run tests
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/windows --parallel 2
          ctest --test-dir build/windows --output-on-failure
      - name: Validate FFmpeg CAS/Lanczos filter graph
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # mpv is installed by the Windows dependency step; run an actual
          # local decode through the new graph before packaging the app.
          test -x /ucrt64/bin/mpv.exe
          /ucrt64/bin/mpv.exe --no-config --no-audio --vo=null --frames=2             '--vf=lavfi=[scale=1920:1080:flags=lanczos,cas=strength=0.30]'             packaging/runtime/switch/xuperswitch/test.mp4
          echo 'CAS + Lanczos filter smoke test passed.'
      - name: Check native renderer orientation with synthetic two-color video
        shell: msys2 {0}
        run: |
          set -euo pipefail
          /ucrt64/bin/ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=red:s=320x180:r=12:d=1' \
            -f lavfi -i 'color=c=blue:s=320x180:r=12:d=1' \
            -filter_complex 'vstack=inputs=2' \
            -an -c:v mpeg4 -q:v 2 build/windows/orientation-test.avi
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_RENDER_DRIVER=software \
            build/windows/XuperNativePlayer.exe \
            build/windows/orientation-test.avi --cpu --smoke 2 \
            --screenshot build/windows/orientation-test.bmp
          python - <<'PY'
          from pathlib import Path
          import struct
          bmp=Path("build/windows/orientation-test.bmp").read_bytes()
          assert bmp[:2]==b"BM", "Missing native screenshot"
          data_offset=struct.unpack_from("<I",bmp,10)[0]
          width,height,planes,bpp=struct.unpack_from("<iiHH",bmp,18)
          assert planes==1, planes[:3]
          assert width>0 and abs(height)>0 and bpp in (24,32), (width,height,bpp)
          stride=((width*bpp+31)//32)*4
          def at(x,y):
              row=(abs(height)-1-y) if height>0 else y
              i=data_offset+row*stride+x*(bpp//8)
              return tuple(bmp[i:i+3]) # B,G,R for BMP
          blue_top,green_top,red_top=at(width//2,abs(height)//4)
          blue_bottom,green_bottom,red_bottom=at(width//2,abs(height)*3//4)
          assert red_top>140 and blue_top<110 and green_top<110, (red_top,green_top,blue_top)
          assert blue_bottom>140 and red_bottom<110 and green_bottom<110, (red_bottom,green_bottom,blue_bottom)
          print("Native video orientation verified: red top / blue bottom")
          PY
      - name: Check native audio decoding and SDL stereo playback path
        shell: msys2 {0}
        run: |
          set -euo pipefail
          /ucrt64/bin/ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=320x180:rate=12:duration=1.5' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=1.5' \
            -c:v mpeg4 -q:v 3 -c:a aac -b:a 96k -shortest \
            build/windows/audio-test.mp4
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_RENDER_DRIVER=software \
            build/windows/XuperNativePlayer.exe \
            build/windows/audio-test.mp4 --cpu --smoke 12 --smoke-audio
          echo 'FFmpeg audio decode, resample and SDL queued audio smoke passed.'
      - name: Package Windows EXE and DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist/Xuper-TV-Desktop/licenses dist/Xuper-TV-Desktop/shaders
          cp build/windows/XuperTVDesktop.exe dist/Xuper-TV-Desktop/
          cp build/windows/XuperTVNovaQt.exe dist/Xuper-TV-Desktop/
          # Bundle Qt Quick's real QML/graphics plugins. This is a separate
          # preview EXE; existing SDL and native-player binaries are unchanged.
          /ucrt64/bin/windeployqt6.exe --release --no-translations \
            --qmldir ui/novaqt \
            --dir dist/Xuper-TV-Desktop \
            dist/Xuper-TV-Desktop/XuperTVNovaQt.exe
          test -s dist/Xuper-TV-Desktop/Qt6Quick.dll
          test -s dist/Xuper-TV-Desktop/Qt6Qml.dll
          # windeployqt normally deploys qwindows only. Our CI smoke test
          # selects the headless 'offscreen' platform; include its plugin so
          # Qt doesn't open an invisible modal missing-plugin error dialog.
          test -s /ucrt64/share/qt6/plugins/platforms/qoffscreen.dll
          mkdir -p dist/Xuper-TV-Desktop/platforms
          cp /ucrt64/share/qt6/plugins/platforms/qoffscreen.dll dist/Xuper-TV-Desktop/platforms/
          cp build/windows/XuperNativeProbe.exe dist/Xuper-TV-Desktop/
          cp build/windows/XuperNativePlayer.exe dist/Xuper-TV-Desktop/
          cp packaging/runtime/switch/xuperswitch/{font.ttf,cacert.pem,test.mp4} dist/Xuper-TV-Desktop/
          cp packaging/runtime/switch/xuperswitch/service.template.json dist/Xuper-TV-Desktop/service.template.json
          cp catalog.m3u dist/Xuper-TV-Desktop/
          cp shaders/FSRCNNX_x2_8-0-4-1.glsl dist/Xuper-TV-Desktop/shaders/
          cp LICENSE LICENSE.nlohmann-json COPYRIGHT.mpv DEPENDENCIAS.md dist/Xuper-TV-Desktop/
          cp -r licenses/. dist/Xuper-TV-Desktop/licenses/
          test -s /ucrt64/share/licenses/qrencode/COPYING
          cp /ucrt64/share/licenses/qrencode/COPYING dist/Xuper-TV-Desktop/licenses/libqrencode-LGPL.txt
          ntldd -R build/windows/XuperTVDesktop.exe > build/windows/dependencies.txt
          ntldd -R build/windows/XuperTVNovaQt.exe >> build/windows/dependencies.txt
          ntldd -R build/windows/XuperNativeProbe.exe >> build/windows/dependencies.txt
          ntldd -R build/windows/XuperNativePlayer.exe >> build/windows/dependencies.txt
          # Current MSYS2 SDL2.dll is sdl2-compat; it dynamically loads
          # SDL3.dll with LoadLibrary, so ntldd cannot discover this runtime.
          # Always bundle SDL3 explicitly. Missing it causes error 0xc0000142.
          test -s /ucrt64/bin/SDL3.dll
          cp /ucrt64/bin/SDL3.dll dist/Xuper-TV-Desktop/
          while IFS= read -r dll; do
            [[ -z "$dll" ]] && continue
            path=$(find /ucrt64/bin -maxdepth 1 -iname "$dll" -print -quit)
            [[ -n "$path" ]] && cp -n "$path" dist/Xuper-TV-Desktop/ || true
          done < <(sed -nE 's/^[[:space:]]*([^[:space:]]+\.dll)[[:space:]]+=>.*/\1/ip' build/windows/dependencies.txt | sort -fu)
          # ntldd -R descends into Windows system DLLs, where API-set redirects
          # and optional OS components often appear as "not found". Do not
          # interpret these as missing bundled runtime DLLs.
          grep -i '=> not found' build/windows/dependencies.txt > dist/Xuper-TV-Desktop/ntldd-unresolved.txt || true
          for required in SDL2.dll SDL3.dll SDL2_ttf.dll libmpv-2.dll libcurl-4.dll libstdc++-6.dll libqrencode.dll; do
            if [[ ! -f "dist/Xuper-TV-Desktop/$required" ]]; then
              echo "Required portable runtime DLL missing: $required"
              exit 1
            fi
          done
          ls -lh dist/Xuper-TV-Desktop/XuperTVDesktop.exe
      - name: Smoke test Qt Quick home outside MSYS2 PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location "dist/Xuper-TV-Desktop"
          try {
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
            $env:QT_QPA_PLATFORM = "offscreen"
            $env:QT_QUICK_BACKEND = "software"
            # Windows GUI-subsystem executables don't reliably populate
            # PowerShell's LASTEXITCODE after a direct invocation.
            # Start-Process gives the real exit code and captures QML errors.
            $logOut = Join-Path $env:RUNNER_TEMP 'nova-qt-smoke-out.txt'
            $logErr = Join-Path $env:RUNNER_TEMP 'nova-qt-smoke-err.txt'
            Remove-Item ".\nova-qt-smoke.log" -ErrorAction SilentlyContinue
            $qt = Start-Process -FilePath ".\XuperTVNovaQt.exe" -ArgumentList @("--smoke") -PassThru -NoNewWindow -RedirectStandardOutput $logOut -RedirectStandardError $logErr
            $finished = $qt.WaitForExit(20000)
            if (-not $finished) {
              Stop-Process -Id $qt.Id -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path $logOut) { Get-Content $logOut }
            if (Test-Path $logErr) { Get-Content $logErr }
            if (Test-Path ".\nova-qt-smoke.log") {
              Get-Content ".\nova-qt-smoke.log"
              Remove-Item ".\nova-qt-smoke.log" -ErrorAction SilentlyContinue
            }
            if (-not $finished) {
              throw "Qt Quick preview did not exit after 20 seconds; see startup checkpoints."
            }
            if ($qt.ExitCode -ne 0) {
              throw "Standalone Qt Quick QML preview failed outside MSYS2 PATH (exit $($qt.ExitCode))."
            }
            Write-Host "Qt6 NOVA first screen loaded with only portable DLLs/plugins."
          } finally {
            Pop-Location
          }
      - name: Smoke test packaged SDL runtime outside MSYS2 PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item "build/windows/sdl_startup_smoke.exe" "dist/Xuper-TV-Desktop/sdl_startup_smoke.exe"
          Push-Location "dist/Xuper-TV-Desktop"
          try {
            # Prevent DLLs in the runner's MSYS2 installation from masking
            # a dependency missing in the portable artifact folder.
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
            $env:SDL_VIDEODRIVER = "dummy"
            & ".\sdl_startup_smoke.exe"
            if ($LASTEXITCODE -ne 0) {
              throw "SDL startup smoke test failed outside MSYS2 PATH (exit $LASTEXITCODE)."
            }
            Write-Host "Packaged SDL2/SDL3 successfully initialized without MSYS2 runtime PATH."
          } finally {
            Pop-Location
            Remove-Item "dist/Xuper-TV-Desktop/sdl_startup_smoke.exe" -ErrorAction SilentlyContinue
          }
      - name: Smoke test packaged native player with no runner DLL paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location "dist/Xuper-TV-Desktop"
          try {
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
            $env:SDL_VIDEODRIVER = "dummy"
            $env:SDL_AUDIODRIVER = "dummy"
            $env:SDL_RENDER_DRIVER = "software"
            $native = Start-Process -FilePath ".\XuperNativePlayer.exe" -ArgumentList @("test.mp4", "--cpu", "--smoke", "12") -Wait -PassThru -NoNewWindow
            if ($native.ExitCode -ne 0) {
              throw "Packaged native video pipeline smoke test failed (exit $($native.ExitCode))."
            }
            Write-Host "Native FFmpeg -> SDL video pipeline passed using portable DLLs."
          } finally {
            Pop-Location
          }
      - name: Prepare bundled, installation-neutral service template
        shell: pwsh
        run: |
          $file = "dist/Xuper-TV-Desktop/service.template.json"
          $config = Get-Content -Raw -Encoding UTF8 $file | ConvertFrom-Json
          foreach ($key in @("portal_hosts", "key_base64", "password_salt", "app_id", "apk_version")) {
            if (-not $config.$key) { throw "Incomplete public service template: $key" }
          }
          foreach ($key in @("installation_serial", "device_id", "userId", "userToken", "sn", "password", "username")) {
            if ($config.PSObject.Properties.Name -contains $key) {
              throw "Refusing to package installation identity: $key"
            }
          }
          $config.ca_file = "cacert.pem"
          $config | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 $file
          if (Test-Path "dist/Xuper-TV-Desktop/service.json") { throw "Never ship device-specific service.json" }
          Copy-Item README_WINDOWS.md dist/Xuper-TV-Desktop/README_WINDOWS.md
          Copy-Item README_VIDEO_ENHANCED.md dist/Xuper-TV-Desktop/README_VIDEO_ENHANCED.md
          Copy-Item README_NATIVE_ENGINE.md dist/Xuper-TV-Desktop/README_NATIVE_ENGINE.md
          Copy-Item README_NATIVE_PLAYER.md dist/Xuper-TV-Desktop/README_NATIVE_PLAYER.md
          Copy-Item README_IPHONE_CATALOG.md dist/Xuper-TV-Desktop/README_IPHONE_CATALOG.md
          Copy-Item README_QR_PAIRING.md dist/Xuper-TV-Desktop/README_QR_PAIRING.md
          Copy-Item README_PROVIDER_CATALOG.md dist/Xuper-TV-Desktop/README_PROVIDER_CATALOG.md
          Copy-Item README_LIVE_TV.md dist/Xuper-TV-Desktop/README_LIVE_TV.md
          if (Test-Path 'README_NOVA_UI.md') { Copy-Item README_NOVA_UI.md dist/Xuper-TV-Desktop/README_NOVA_UI.md }
          if (Test-Path 'README_NOVA_QT.md') { Copy-Item README_NOVA_QT.md dist/Xuper-TV-Desktop/README_NOVA_QT.md }
          Write-Host "Bundled service template verified. No APK import required."
      # The account's Actions artifact storage quota is currently exhausted.
      # Instead of silently failing or deleting old user artifacts, stage 3
      # can provide its verified ZIP on a dedicated orphan branch. No release.
      - name: Publish temporary ZIP to isolated build-delivery branch
        if: github.ref_name == 'windows-desktop-preview' || github.ref_name == 'feature/nova-ui-from-scratch' || (github.event_name == 'pull_request' && github.head_ref == 'feature/nova-ui-from-scratch' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOVA_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep the experimental NOVA download separate from the existing
          # integrated Windows build. Never rewrite main or an unrelated branch.
          $isNova = $env:NOVA_SOURCE_BRANCH -eq 'feature/nova-ui-from-scratch'
          $name = if ($isNova) { 'XuperTV-NOVA-Windows-Preview.zip' } else { 'XuperTV-Integrated-Windows-Preview.zip' }
          $deliveryBranch = if ($isNova) { 'build/nova-ui-preview' } else { 'build/live-tv-recovery' }
          $title = if ($isNova) { 'XuperTV Desktop - NOVA experimental UI' } else { 'XuperTV Desktop - integrated Windows preview' }
          $zip = Join-Path $env:RUNNER_TEMP $name
          Compress-Archive -Path 'dist/Xuper-TV-Desktop' -DestinationPath $zip -CompressionLevel Optimal
          $bytes = (Get-Item $zip).Length
          Write-Host "Portable ZIP size: $bytes bytes"
          if ($bytes -ge 95000000) {
            throw "ZIP exceeds safe GitHub single-file limit; not publishing."
          }
          $folder = Join-Path $env:RUNNER_TEMP 'delivery'
          git worktree add --detach $folder HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not open delivery worktree' }
          Push-Location $folder
          try {
            git checkout --orphan $deliveryBranch
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create delivery branch' }
            git rm -r --cached --ignore-unmatch . | Out-Null
            Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } |
              Remove-Item -Recurse -Force
            Copy-Item $zip -Destination (Join-Path $folder $name)
            $hash = (Get-FileHash -Algorithm SHA256 $name).Hash
            @(
              $title,
              'Unsigned portable Windows test build. main remains untouched.',
              "SHA256: $hash",
              "Source branch: $env:NOVA_SOURCE_BRANCH",
              "Source commit: $env:GITHUB_SHA",
              'Extract the ZIP as one folder. Do not mix DLLs from older builds.'
            ) | Set-Content -Encoding UTF8 README.txt
            git add -- $name README.txt
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "$title ZIP (automated verified build)"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot commit delivery package' }
            git push --force origin HEAD:refs/heads/$deliveryBranch
            if ($LASTEXITCODE -ne 0) { throw 'Cannot publish delivery branch' }
            Write-Host "Temporary download: https://github.com/$env:GITHUB_REPOSITORY/raw/refs/heads/$deliveryBranch/$name"
          } finally {
            Pop-Location
          }
      - name: Upload test build (not a release)
        if: github.ref_name != 'windows-desktop-preview' && github.ref_name != 'feature/nova-ui-from-scratch' && github.head_ref != 'feature/nova-ui-from-scratch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'feature/nova-ui-from-scratch' && 'XuperTV-Nova-Windows' || 'XuperTV-Live-TV-Recovery-Windows' }}
          path: dist/Xuper-TV-Desktop/
          if-no-files-found: error
