name: Veyra adapter | real API MSVC check
on:
  push:
    branches: [feature/nova-veyra-engine]
    paths: ['integrations/veyra/**', 'tools/Apply-VeyraNovaBridge.py', '.github/workflows/veyra-bridge-msvc.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Likely7/Veyra-NRVideo
          ref: bf596e11112ab350e66d91dfb9c7ea742c254fb4
          path: upstream-veyra
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Apply bridge to reviewed Veyra 2.1.9 source
        run: python tools/Apply-VeyraNovaBridge.py upstream-veyra
      - name: Compile adapter against actual Veyra headers (no GPU or link)
        shell: pwsh
        run: |
          '#include "NovaStdioBridge.hpp"' | Set-Content -Encoding utf8 bridge-api-check.cpp
          $includes = @('upstream-veyra/apps/veyra-qml', 'upstream-veyra/include', "$env:QT_ROOT_DIR/include")
          foreach ($module in @('QtCore','QtGui','QtQml','QtQuick','QtNetwork')) {
            $includes += "$env:QT_ROOT_DIR/include/$module"
          }
          $args = @('/nologo','/std:c++20','/utf-8','/EHsc','/Zs','/DNOMINMAX','/DWIN32_LEAN_AND_MEAN')
          foreach ($path in $includes) { $args += "/I$path" }
          & cl @args bridge-api-check.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Real Veyra API compile failed' }
